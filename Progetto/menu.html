<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Selector BLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #007AFF;
            --primary-glow: rgba(0, 122, 255, 0.3);
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, rgba(0, 122, 255, 0.1), transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 750px;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .robot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .robot-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem 1.5rem 2rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .robot-card:hover:not(.selected) {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .robot-card.selected {
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.06);
            box-shadow: 0 0 25px var(--primary-glow);
            transform: translateY(-5px);
        }

        .img-container {
            height: 140px;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 3.5rem;
            overflow: visible; 
        }

        .robot-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
            transition: all 0.4s ease;
            transform-origin: bottom center;
        }

        .cingolato-img { transform: scale(1.2) translateY(10px); }
        .ragno-img { transform: scale(2.3) translateY(50px); }

        .robot-card.selected .cingolato-img { transform: scale(1.3) translateY(10px); }
        .robot-card.selected .ragno-img { transform: scale(2.4) translateY(50px); }

        #status {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
            min-height: 1.2rem;
        }

        .action-container {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #btn-connect {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 45px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        #btn-connect.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .back-home {
            display: inline-block;
            margin-top: 1.25rem;
            padding: 12px 28px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            color: var(--text-main);
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.08);
        }

        #btn-connect:disabled {
            background: #444;
            opacity: 0.7;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .robot-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Seleziona la tua unità</h1>

        <div class="robot-grid">
            <div class="robot-card" onclick="selectRobot(this, 'cingolato.html', 'Cingolato')">
                <div class="img-container">
                    <img src="cintolato2.png" alt="Cingolato" class="robot-img cingolato-img">
                </div>
                <h2>Cingolato</h2>
            </div>

            <div class="robot-card" onclick="selectRobot(this, 'quadrupede.html', 'Quadrupede')">
                <div class="img-container">
                    <img src="Ragno1-removebg-preview.png" alt="Quadrupede" class="robot-img ragno-img">
                </div>
                <h2>Quadrupede</h2>
            </div>
        </div>

        <div id="status">Scegli un robot per iniziare</div>

        <div class="action-container">
            <button id="btn-connect" onclick="startConnection()">Connettiti</button>
        </div>

        <a class="back-home" href="home.html">Torna alla home</a>
    </div>

    <script>
        const SERVICE_UUID = '19b10000-e8f2-537e-4f6c-d104768a1214';
        const CHAR_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';
        
        let currentTargetUrl = "";
        let device, server, service, char;

        const btnConnect = document.getElementById('btn-connect');
        const statusEl = document.getElementById('status');

        function selectRobot(element, url, name) {
            document.querySelectorAll('.robot-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');

            currentTargetUrl = url;
            btnConnect.innerText = `Connettiti a ${name}`;
            btnConnect.classList.add('visible');
            statusEl.textContent = `Pronto per connettere il ${name}`;
        }

        async function startConnection() {
            if (!currentTargetUrl) return;

            try {
                btnConnect.disabled = true;
                statusEl.textContent = 'Stato: cercando Nano33BLE...';

                // 1. Richiesta dispositivo con filtro nome
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Nano33BLE' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusEl.textContent = 'Stato: connettendo al GATT server...';
                
                // 2. Connessione al server
                server = await device.gatt.connect();

                // 3. Controllo servizio e caratteristica (per sicurezza prima del redirect)
                statusEl.textContent = 'Stato: verifica servizi...';
                service = await server.getPrimaryService(SERVICE_UUID);
                char = await service.getCharacteristic(CHAR_UUID);

                statusEl.textContent = 'Stato: Connesso! Reindirizzamento...';

                // 4. Redirect alla pagina specifica
                // ATTENZIONE: Il redirect chiuderà questa sessione BLE. 
                // La pagina successiva dovrà gestire la propria connessione.
                setTimeout(() => {
                    window.location.href = currentTargetUrl;
                }, 1000);

            } catch (err) {
                console.error(err);
                statusEl.textContent = 'Errore: Connessione fallita o annullata.';
                btnConnect.disabled = false;
            }
        }

        // Controllo supporto browser
        if (!navigator.bluetooth) {
            statusEl.textContent = 'Web Bluetooth non supportato in questo browser.';
            btnConnect.style.display = 'none';
        }
    </script>

</body>
</html>
