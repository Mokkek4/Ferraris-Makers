<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selezione robot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #007AFF;
            --primary-glow: rgba(0, 122, 255, 0.3);
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, rgba(0, 122, 255, 0.1), transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 750px;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .robot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .robot-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem 1.5rem 2rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .robot-card:hover:not(.selected) {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .robot-card.selected {
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.06);
            box-shadow: 0 0 25px var(--primary-glow);
            transform: translateY(-5px);
        }

        .img-container {
            height: 140px;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 3.5rem;
            overflow: visible; 
        }

        .robot-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
            transition: all 0.4s ease;
            transform-origin: bottom center;
        }

        .cingolato-img { transform: scale(1.2) translateY(10px); }
        .ragno-img { transform: scale(2.3) translateY(50px); }

        .robot-card.selected .cingolato-img { transform: scale(1.3) translateY(10px); }
        .robot-card.selected .ragno-img { transform: scale(2.4) translateY(50px); }

        /* Status indicator style from the first file */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(255,255,255,.05);
            border: 1px solid var(--card-border);
            font-size: 14px;
            color: #cbd2e1;
            margin: 0 0 1.5rem 0;
            max-width: 100%;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); flex: none; }

        .action-container {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #btn-connect {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 45px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        #btn-connect.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .back-home {
            display: inline-block;
            margin-top: 1.25rem;
            padding: 12px 28px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            color: var(--text-main);
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.08);
        }

        @media (max-width: 600px) {
            .robot-grid { grid-template-columns: 1fr; }
        }
            /* Ottimizzazione mobile */
        @media (max-width: 700px) {
            body { overflow-x: hidden; }
            header { gap: 0.75rem; padding: 0.65rem 1rem; }
            header nav, nav { min-width: 0; }
            nav ul { justify-content: flex-end; flex-wrap: wrap; gap: 0.55rem 0.9rem; }
            nav ul li a { font-size: 0.78rem; white-space: nowrap; }
            .logo { height: 34px; max-width: 130px; }
            .hero { padding: 3rem 1.25rem; }
            .hero h1, h1 { font-size: clamp(1.8rem, 9vw, 2.35rem); line-height: 1.15; }
            .hero p { font-size: 1rem; }
            .hero-content { grid-template-columns: 1fr; gap: 2rem; }
            .hero-copy { text-align: center; }
            .hero-copy p, .hero p { margin-left: auto; margin-right: auto; }
            .hero-visual, .visual { width: 100%; max-width: 100%; transform: none; }
            .project-image, .visual img { height: min(62vw, 280px); }
            .content-section, .section, .info-section, .management-section { margin: 2rem 1rem; padding: 2rem 1.1rem; border-radius: 14px; }
            .catalog-section, .hackathon-section, main { margin: 2rem auto; padding: 0 1rem; }
            .section-title { font-size: 1.65rem; margin-bottom: 1.25rem; }
            .robot-grid, .features-grid, .hackathon-grid { grid-template-columns: 1fr; gap: 1.25rem; }
            .robot-card, .hackathon-card { min-width: 0; }
            .robot-image-container { height: min(58vw, 230px); }
            .robot-info, .hackathon-info { padding: 1.15rem; }
            .filters-bar { gap: 0.5rem; margin-bottom: 1.75rem; }
            .filter-btn { font-size: 0.78rem; padding: 0.45rem 0.7rem; }
            .catalog-section.impresa-view .robot-grid, .catalog-section.impresa-view .robot-card[data-category~="impresa"] { width: 100%; grid-template-columns: 1fr; }
            .video-container { padding-top: 56.25%; }
            .video-frame { width: 100%; }
            footer { padding: 1.5rem 1rem; }
            footer p { font-size: 0.8rem; }
            .ai-credit { font-size: 0.6rem; }
        }

        @media (max-width: 420px) {
            header { align-items: flex-start; }
            nav ul { gap: 0.4rem 0.65rem; }
            nav ul li a { font-size: 0.7rem; }
            .logo { height: 30px; max-width: 110px; }
            .content-section, .section, .info-section, .management-section { padding: 1.5rem 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Seleziona la tua unità</h1>

        <div class="robot-grid">
            <div class="robot-card" onclick="selectRobot(this, 'cingolato.html', 'Cingolato')">
                <div class="img-container">
                    <img src="cintolato2.png" alt="Cingolato" class="robot-img cingolato-img">
                </div>
                <h2>Cingolato</h2>
            </div>

            <div class="robot-card" onclick="selectRobot(this, 'quadrupede.html', 'Quadrupede')">
                <div class="img-container">
                    <img src="Ragno1-removebg-preview.png" alt="Quadrupede" class="robot-img ragno-img">
                </div>
                <h2>Quadrupede</h2>
            </div>
        </div>

        <div class="status"><i class="dot"></i><span id="status">Scegli un robot per iniziare</span></div>

        <div class="action-container">
            <button id="btn-connect" onclick="openRobot()">Apri controllo</button>
        </div>

        <a class="back-home" href="home.html">Torna alla home</a>
    </div>

        <script>
        let currentTargetUrl = "";

        const btnConnect = document.getElementById('btn-connect');
        const statusEl = document.getElementById('status');

        function selectRobot(element, url, name) {
            document.querySelectorAll('.robot-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');

            currentTargetUrl = url;
            btnConnect.innerText = `Apri ${name}`;
            btnConnect.classList.add('visible');
            statusEl.textContent = `Pronto per aprire il controllo del ${name}`;
        }

        function openRobot() {
            if (!currentTargetUrl) return;
            window.location.href = currentTargetUrl;
        }
    </script>

</body>
</html>
